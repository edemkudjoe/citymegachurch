<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Prayer Camp — City Mega Church</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .camp-card {
      cursor: pointer;
      border: 2px solid var(--border);
    }
    .camp-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .camp-card.full { opacity: 0.5; cursor: not-allowed; }
    .spaces-tag {
      font-size: 0.78rem;
      font-family: var(--font-display);
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
      display: inline-block;
    }
    .spaces-tag.open { background: rgba(34,197,94,0.15); color: var(--success); }
    .spaces-tag.low { background: rgba(245,158,11,0.15); color: var(--warning); }
    .spaces-tag.full { background: rgba(239,68,68,0.15); color: var(--danger); }
    #bookingFormSection { display: none; }
    .success-panel { text-align: center; padding: 64px 24px; }
    .success-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(34,197,94,0.15); color: var(--success);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 24px;
    }
    .booking-ref {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-light);
      letter-spacing: 0.05em;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <section style="padding-top:160px; padding-bottom:48px;">
    <div class="container section-head">
      <span class="eyebrow">Prayer Camp</span>
      <h1>Book Your Spot</h1>
      <p>Choose a camp below, then fill in your details to register.</p>
    </div>
  </section>

  <section style="padding-top:0;" id="campsSection">
    <div class="container">
      <div class="grid grid-3" id="campsGrid">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </section>

  <section style="padding-top:0;" id="bookingFormSection">
    <div class="container" style="max-width:640px;">
      <div class="card">
        <div class="card-body">
          <div id="selectedCampBanner" class="card-meta mb-32"></div>

          <form id="bookingForm">
            <div class="form-group">
              <label for="full_name">Full Name</label>
              <input type="text" id="full_name" required />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" required />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                  <option value="">Select</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth" />
              </div>
            </div>
            <div class="form-group">
              <label for="emergency_contact">Emergency Contact (Name & Phone)</label>
              <input type="text" id="emergency_contact" required placeholder="e.g. Jane Doe, 024 123 4567" />
            </div>
            <div class="form-group">
              <label for="prayer_request">Prayer Request <span style="font-weight:400;">(optional)</span></label>
              <textarea id="prayer_request" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label for="additional_notes">Additional Notes <span style="font-weight:400;">(optional)</span></label>
              <textarea id="additional_notes" rows="2"></textarea>
            </div>

            <div class="form-error" id="formError"></div>
            <div style="display:flex; gap:12px; margin-top:32px;">
              <button type="button" class="btn btn-outline" id="backBtn">Back</button>
              <button type="submit" class="btn btn-primary" style="flex:1;" id="submitBtn">Submit Booking</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top:0; display:none;" id="successSection">
    <div class="container" style="max-width:560px;">
      <div class="card">
        <div class="success-panel">
          <div class="success-icon">&#10003;</div>
          <h2>Booking Received</h2>
          <p class="mt-32">Your booking reference is:</p>
          <div class="booking-ref" id="successRef"></div>
          <p id="successCampName"></p>
          <p class="form-hint mt-32">Save this reference — you'll need it to check your booking status. We'll be in touch as your registration is reviewed.</p>
          <div style="display:flex; gap:12px; margin-top:32px; justify-content:center;">
            <a href="/index.html" class="btn btn-outline">Back to Home</a>
            <a href="/booking-status.html" class="btn btn-primary" id="checkStatusLink">Check Status</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let camps = [];
    let selectedCamp = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function spaceTagClass(camp) {
      if (!camp.registration_open || camp.available_spaces <= 0) return 'full';
      if (camp.available_spaces <= camp.max_participants * 0.15) return 'low';
      return 'open';
    }
    function spaceTagLabel(camp) {
      if (!camp.registration_open) return 'Registration Closed';
      if (camp.available_spaces <= 0) return 'Fully Booked';
      return `${camp.available_spaces} spot${camp.available_spaces === 1 ? '' : 's'} left`;
    }

    function renderCamps() {
      const grid = document.getElementById('campsGrid');
      if (!camps.length) {
        grid.innerHTML = '<div class="empty-state">No camps are open for registration right now — check back soon.</div>';
        return;
      }
      grid.innerHTML = camps.map(c => {
        const full = !c.registration_open || c.available_spaces <= 0;
        return `
        <div class="card camp-card ${full ? 'full' : ''}" data-id="${c.id}">
          ${c.cover_image_url ? `<img src="${escapeHtml(c.cover_image_url)}" alt="${escapeHtml(c.name)}" />` : ''}
          <div class="card-body">
            <span class="spaces-tag ${spaceTagClass(c)}">${spaceTagLabel(c)}</span>
            <h3 class="mt-32">${escapeHtml(c.name)}</h3>
            <div class="card-meta">${formatDate(c.start_date)} &ndash; ${formatDate(c.end_date)}</div>
            ${c.venue ? `<p style="margin-bottom:8px;"><strong style="color:var(--fg);">Venue:</strong> ${escapeHtml(c.venue)}</p>` : ''}
            <p>${escapeHtml(c.description || '')}</p>
          </div>
        </div>
      `}).join('');

      grid.querySelectorAll('.camp-card').forEach(el => {
        el.addEventListener('click', () => {
          const camp = camps.find(c => c.id === el.dataset.id);
          if (!camp.registration_open || camp.available_spaces <= 0) return;
          selectCamp(camp);
        });
      });
    }

    function selectCamp(camp) {
      selectedCamp = camp;
      document.getElementById('campsSection').style.display = 'none';
      document.getElementById('bookingFormSection').style.display = 'block';
      document.getElementById('selectedCampBanner').textContent =
        `Booking: ${camp.name} · ${formatDate(camp.start_date)} – ${formatDate(camp.end_date)}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('bookingFormSection').style.display = 'none';
      document.getElementById('campsSection').style.display = 'block';
      document.getElementById('formError').classList.remove('visible');
    });

    api('/camps').then(data => {
      camps = data;
      renderCamps();
    }).catch(() => {
      document.getElementById('campsGrid').innerHTML = '<div class="empty-state">Unable to load camps right now.</div>';
    });

    // Prefill from logged-in user if available
    document.addEventListener('DOMContentLoaded', () => {
      const user = getStoredUser();
      if (user) {
        document.getElementById('full_name').value = user.full_name || '';
        document.getElementById('email').value = user.email || '';
        if (user.phone) document.getElementById('phone_number').value = user.phone;
      }
    });

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('formError');
      const btn = document.getElementById('submitBtn');
      errorEl.classList.remove('visible');

      const body = {
        camp_id: selectedCamp.id,
        full_name: document.getElementById('full_name').value.trim(),
        phone_number: document.getElementById('phone_number').value.trim(),
        email: document.getElementById('email').value.trim(),
        gender: document.getElementById('gender').value || null,
        date_of_birth: document.getElementById('date_of_birth').value || null,
        emergency_contact: document.getElementById('emergency_contact').value.trim(),
        prayer_request: document.getElementById('prayer_request').value.trim() || null,
        additional_notes: document.getElementById('additional_notes').value.trim() || null,
      };

      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        const result = await api('/bookings', { method: 'POST', body, auth: true });
        document.getElementById('bookingFormSection').style.display = 'none';
        document.getElementById('successSection').style.display = 'block';
        document.getElementById('successRef').textContent = result.booking_ref;
        document.getElementById('successCampName').textContent = result.camp_name || selectedCamp.name;
        document.getElementById('checkStatusLink').href = `/booking-status.html?ref=${result.booking_ref}`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Submit Booking';
      }
    });
  </script>
</body>
</html>
