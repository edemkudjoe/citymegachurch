<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — City Mega Church</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .dash-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
      overflow-x: auto;
    }
    .dash-tab {
      background: none;
      border: none;
      color: var(--fg-dim);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 14px 4px;
      margin-right: 28px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .dash-tab.active { color: var(--fg); border-color: var(--accent); }
    .dash-panel { display: none; }
    .dash-panel.active { display: block; }
    .booking-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .booking-row-main { flex: 1; min-width: 220px; }
    .booking-row-actions { display: flex; gap: 10px; align-items: center; }
    .claim-form { display: flex; gap: 12px; max-width: 420px; }
    .claim-form input { flex: 1; }
  </style>
</head>
<body>

  <section style="padding-top:160px; padding-bottom:80px; min-height:70vh;">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">My Account</span>
        <h1 id="greeting">Welcome back</h1>
      </div>

      <div class="dash-tabs">
        <button class="dash-tab active" data-panel="bookings">My Bookings</button>
        <button class="dash-tab" data-panel="profile">Profile</button>
      </div>

      <!-- BOOKINGS PANEL -->
      <div class="dash-panel active" id="panel-bookings">
        <div id="bookingsList">
          <div class="loading-spinner"></div>
        </div>

        <div class="card mt-32">
          <div class="card-body">
            <h3>Booked as a guest?</h3>
            <p class="mt-32" style="margin-bottom:20px;">If you registered for a camp before creating this account, enter your booking reference below to add it here.</p>
            <form class="claim-form" id="claimForm">
              <input type="text" id="claimRef" placeholder="e.g. CMC-2026-0001" required />
              <button type="submit" class="btn btn-outline">Link Booking</button>
            </form>
            <div class="form-error" id="claimError"></div>
          </div>
        </div>
      </div>

      <!-- PROFILE PANEL -->
      <div class="dash-panel" id="panel-profile">
        <div class="card" style="max-width:560px;">
          <div class="card-body">
            <form id="profileForm">
              <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" required />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" disabled />
                <div class="form-hint">Email can't be changed here. Contact the church office if you need this updated.</div>
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="gender">Gender</label>
                  <select id="gender">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="date_of_birth">Date of Birth</label>
                  <input type="date" id="date_of_birth" />
                </div>
              </div>
              <div class="form-group">
                <label for="emergency_contact">Emergency Contact</label>
                <input type="text" id="emergency_contact" placeholder="e.g. Jane Doe, 024 123 4567" />
              </div>
              <div class="form-error" id="profileError"></div>
              <button type="submit" class="btn btn-primary mt-32" id="profileSubmitBtn">Save Changes</button>
            </form>
          </div>
        </div>

        <button class="btn btn-outline mt-32" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </section>

  <!-- Confirmation view (opened per-booking) -->
  <div class="lightbox" id="confirmModal" style="align-items:flex-start; overflow-y:auto; padding:100px 24px;">
    <button class="lightbox-close" id="confirmClose">&times;</button>
    <div class="container" style="max-width:560px;">
      <div class="card" id="confirmCard" style="background:var(--bg-raised-2);">
        <div class="card-body" id="confirmBody"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    // Guard: redirect to login if not authenticated
    const user = getStoredUser();
    if (!user || !getToken()) {
      window.location.href = '/login.html';
    }

    document.getElementById('greeting').textContent = `Welcome back, ${user.full_name.split(' ')[0]}`;

    // ---------- Tabs ----------
    document.querySelectorAll('.dash-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.dash-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${tab.dataset.panel}`).classList.add('active');
      });
    });

    // ---------- Bookings ----------
    const badgeClass = { Pending: 'badge-pending', Approved: 'badge-approved', Declined: 'badge-declined' };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderBookings(bookings) {
      const list = document.getElementById('bookingsList');
      if (!bookings.length) {
        list.innerHTML = '<div class="empty-state">You don\'t have any camp bookings yet. <br/><a href="/book-camp.html" style="color:var(--accent-light);">Book a prayer camp</a></div>';
        return;
      }
      list.innerHTML = bookings.map(b => `
        <div class="booking-row">
          <div class="booking-row-main">
            <div class="card-meta">${escapeHtml(b.booking_ref)}</div>
            <h3>${escapeHtml(b.prayer_camps ? b.prayer_camps.name : 'Prayer Camp')}</h3>
            ${b.prayer_camps ? `<p style="margin-top:4px;">${formatDate(b.prayer_camps.start_date)} &ndash; ${formatDate(b.prayer_camps.end_date)}</p>` : ''}
          </div>
          <div class="booking-row-actions">
            <span class="badge ${badgeClass[b.status]}">${escapeHtml(b.status)}</span>
            <button class="btn btn-outline" style="padding:10px 18px; font-size:0.85rem;" data-booking-id="${b.id}">View</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('[data-booking-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const booking = bookings.find(b => b.id === btn.dataset.bookingId);
          openConfirmation(booking);
        });
      });
    }

    function loadBookings() {
      api('/my-bookings', { auth: true }).then(renderBookings).catch(err => {
        document.getElementById('bookingsList').innerHTML = `<div class="empty-state">Unable to load bookings: ${escapeHtml(err.message)}</div>`;
      });
    }
    loadBookings();

    // ---------- Claim guest booking ----------
    document.getElementById('claimForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('claimError');
      errorEl.classList.remove('visible');
      const ref = document.getElementById('claimRef').value.trim();

      try {
        await api('/my-bookings', { method: 'POST', auth: true, body: { action: 'claim', booking_ref: ref } });
        showToast('Booking linked to your account.');
        document.getElementById('claimRef').value = '';
        loadBookings();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      }
    });

    // ---------- Confirmation modal ----------
    function openConfirmation(booking) {
      const camp = booking.prayer_camps || {};
      document.getElementById('confirmBody').innerHTML = `
        <div class="eyebrow">Booking Confirmation</div>
        <h2 class="mt-32">${escapeHtml(camp.name || 'Prayer Camp')}</h2>
        <div class="card-meta mt-32">${escapeHtml(booking.booking_ref)}</div>
        <div style="margin-top:24px; display:grid; gap:12px;">
          <div><strong style="color:var(--fg);">Name:</strong> ${escapeHtml(booking.full_name)}</div>
          <div><strong style="color:var(--fg);">Email:</strong> ${escapeHtml(booking.email)}</div>
          <div><strong style="color:var(--fg);">Phone:</strong> ${escapeHtml(booking.phone_number)}</div>
          ${camp.start_date ? `<div><strong style="color:var(--fg);">Dates:</strong> ${formatDate(camp.start_date)} &ndash; ${formatDate(camp.end_date)}</div>` : ''}
          ${camp.venue ? `<div><strong style="color:var(--fg);">Venue:</strong> ${escapeHtml(camp.venue)}</div>` : ''}
          <div><strong style="color:var(--fg);">Status:</strong> <span class="badge ${badgeClass[booking.status]}">${escapeHtml(booking.status)}</span></div>
        </div>
        <div style="display:flex; gap:12px; margin-top:32px;">
          <button class="btn btn-primary" id="printConfirmBtn">Download / Print</button>
        </div>
      `;
      document.getElementById('confirmModal').classList.add('open');
      document.getElementById('printConfirmBtn').addEventListener('click', () => window.print());
    }
    document.getElementById('confirmClose').addEventListener('click', () => {
      document.getElementById('confirmModal').classList.remove('open');
    });

    // ---------- Profile ----------
    api('/profile', { auth: true }).then(profile => {
      document.getElementById('full_name').value = profile.full_name || '';
      document.getElementById('email').value = profile.email || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('gender').value = profile.gender || '';
      document.getElementById('date_of_birth').value = profile.date_of_birth || '';
      document.getElementById('emergency_contact').value = profile.emergency_contact || '';
    }).catch(() => {});

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('profileError');
      const btn = document.getElementById('profileSubmitBtn');
      errorEl.classList.remove('visible');

      const body = {
        full_name: document.getElementById('full_name').value.trim(),
        phone: document.getElementById('phone').value.trim() || null,
        gender: document.getElementById('gender').value || null,
        date_of_birth: document.getElementById('date_of_birth').value || null,
        emergency_contact: document.getElementById('emergency_contact').value.trim() || null,
      };

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const updated = await api('/profile', { method: 'PUT', auth: true, body });
        setStoredUser({ ...user, full_name: updated.full_name, phone: updated.phone });
        showToast('Profile updated.');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    });

    // ---------- Logout ----------
    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearToken();
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>
