<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — City Mega Church</title>
  <link rel="icon" href="/images/logo1.png" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <section style="padding-top:160px; min-height:80vh; display:flex; align-items:center;">
    <div class="container" style="max-width:440px;">
      <div class="text-center mb-32">
        <span class="eyebrow">Welcome Back</span>
        <h1 style="font-size:2.2rem; margin-top:12px;">Log In</h1>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <div class="form-error" id="formError"></div>
        <button type="submit" class="btn btn-primary btn-block mt-32" id="submitBtn">Log In</button>
      </form>

      <p class="text-center mt-32">
        Don't have an account? <a href="/register.html" style="color:var(--accent-light);">Sign up</a>
      </p>
    </div>
  </section>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('formError');
      const btn = document.getElementById('submitBtn');
      errorEl.classList.remove('visible');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const { token, user } = await api('/auth/login', { method: 'POST', body: { email, password } });
        setToken(token);
        setStoredUser(user);
        window.location.href = user.role === 'admin' ? '/admin/dashboard.html' : '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
