<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — City Mega Church</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <section style="padding-top:160px; padding-bottom:48px;">
    <div class="container section-head">
      <span class="eyebrow">We'd Love to Meet You</span>
      <h1>Plan Your Visit</h1>
      <p>Reach out, or drop by — we'd love to have you.</p>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="container grid grid-2" style="gap:64px;">
      <div>
        <h3>Get in Touch</h3>
        <div class="mt-32" id="contactDetails">
          <div class="loading-spinner"></div>
        </div>
        <div class="social-links mt-32" id="socialLinks"></div>
      </div>
      <div id="mapContainer" style="border-radius:16px; overflow:hidden; min-height:360px; background:var(--bg-raised);"></div>
    </div>
  </section>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    api('/church-info').then(info => {
      const details = document.getElementById('contactDetails');
      details.innerHTML = `
        ${info.address ? `<p style="margin-bottom:16px;"><strong style="color:var(--fg);">Address</strong><br/>${info.address}</p>` : ''}
        ${info.phone ? `<p style="margin-bottom:16px;"><strong style="color:var(--fg);">Phone</strong><br/><a href="tel:${info.phone}">${info.phone}</a></p>` : ''}
        ${info.email ? `<p style="margin-bottom:16px;"><strong style="color:var(--fg);">Email</strong><br/><a href="mailto:${info.email}">${info.email}</a></p>` : ''}
      `;
      if (!info.address && !info.phone && !info.email) {
        details.innerHTML = '<p>Contact details coming soon.</p>';
      }
      function normalizeExternalUrl(url) {
        if (!url) return url;
        return /^https?:\/\//i.test(url) ? url : `https://${url}`;
      }
      const socials = document.getElementById('socialLinks');
      const socialMap = [
        { key: 'facebook_url', label: 'Facebook', icon: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34v7.03C18.34 21.21 22 17.06 22 12.06z"/></svg>' },
        { key: 'instagram_url', label: 'Instagram', icon: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>' },
        { key: 'twitter_url', label: 'X', icon: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' },
        { key: 'youtube_url', label: 'YouTube', icon: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5.5" width="20" height="13" rx="4"/><path d="M10.5 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>' },
        { key: 'tiktok_url', label: 'TikTok', icon: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M14.5 3h2.6c.2 1.6 1.4 2.9 3 3.1v2.6c-1.1 0-2.2-.3-3.1-.9v6.6a4.9 4.9 0 1 1-4.9-4.9c.2 0 .4 0 .6.1v2.7a2.2 2.2 0 1 0 1.5 2.1V3z"/></svg>' },
      ];
      socials.innerHTML = socialMap
        .filter(s => info[s.key])
        .map(s => `<a href="${normalizeExternalUrl(info[s.key])}" target="_blank" rel="noopener" aria-label="${s.label}">${s.icon}</a>`)
        .join('');

      const mapContainer = document.getElementById('mapContainer');
      if (info.google_maps_embed_url) {
        mapContainer.innerHTML = `<iframe src="${info.google_maps_embed_url}" width="100%" height="100%" style="border:0; min-height:360px;" allowfullscreen loading="lazy"></iframe>`;
      } else {
        mapContainer.innerHTML = '<div class="empty-state" style="height:100%; display:flex; align-items:center; justify-content:center;">Map coming soon.</div>';
      }
    }).catch(() => {
      document.getElementById('contactDetails').innerHTML = '<p>Unable to load contact details.</p>';
    });
  </script>
</body>
</html>
